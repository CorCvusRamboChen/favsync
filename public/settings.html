<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-doc="app.settings">设置 · FavSync</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/page.css">
<link rel="stylesheet" href="/css/settings.css">
</head>
<body class="pg">
<header class="pg-top">
  <a class="back" href="/library.html"><b>Fav</b>Sync</a>
  <h1 data-i18n="app.settings">设置</h1>
  <div class="sp"></div>
  <div class="tools" id="hdrTools" data-page="settings"></div>
</header>
<main class="st">
  <section class="sect" id="connSect">
    <h2 data-i18n="st.conn">连接与授权</h2>
    <p class="lead" data-i18n="st.conn.sub"></p>
    <div class="conn-grid" id="connGrid"><div class="card"><div class="meta" data-i18n="common.reading">读取中…</div></div></div>
  </section>

  <section class="sect">
    <h2 data-i18n="st.platforms">平台</h2>
    <div class="plat-grid" id="platGrid">
      <div class="card plat" id="plat-douyin"><div class="meta" data-i18n="common.reading">读取中…</div></div>
      <div class="card plat" id="plat-x"><div class="meta" data-i18n="common.reading">读取中…</div></div>
      <div class="card plat" id="plat-weibo"><div class="meta" data-i18n="common.reading">读取中…</div></div>
    </div>
    <div class="card sched" id="schedCard"><div class="meta" data-i18n="common.reading">读取中…</div></div>
  </section>

  <section class="sect">
    <h2 data-i18n="st.archive">存档目录</h2>
    <div class="card" id="archiveCard"><div class="meta" data-i18n="common.reading">读取中…</div></div>
  </section>
</main>
<div id="toast"></div>
<script src="/js/i18n.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>
