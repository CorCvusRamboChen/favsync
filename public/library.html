<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-doc="app.library">收藏库 · FavSync</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/page.css">
<link rel="stylesheet" href="/css/library.css">
</head>
<body class="pg">
<header class="pg-top">
  <a class="back" href="/library.html"><b>Fav</b>Sync</a>
  <h1 data-i18n="app.library">收藏库</h1>
  <div class="sp"></div>
  <div class="tools" id="hdrTools" data-page="library"></div>
</header>
<main id="main"><div class="empty" data-i18n="common.loading">加载中…</div></main>
<div id="toast"></div>
<script src="/js/i18n.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/library.js"></script>
<script>
async function render() {
  const r = await fetch('/api/library?' + libQuery());
  if (!r.ok) { $('#main').innerHTML = `<div class="empty">${esc(t('lib.load.fail', { s: r.status }))}</div>`; return; }
  $('#main').innerHTML = htmlLibrary(shapeLibrary(await r.json()));
  libWatchMore();
  loadArchive();   // 要读磁盘，不挡列表渲染
}
// 深链：/library.html?tag=xxx 或 ?media=video / ?source=抖音 / ?q=关键词
const qp = new URLSearchParams(location.search);
for (const k of ['tag', 'source', 'q', 'media']) if (qp.get(k)) libFilter[k] = qp.get(k);
render();
connectLive(render);   // 后台同步进了新东西 / 媒体落盘 → 这页自动刷新
</script>
</body>
</html>
